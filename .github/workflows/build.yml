name: Build Galileya Music APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Galileya_Music_Android_Studio_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q Galileya_Music_Android_Studio_Project.zip -d source

      - name: Build APK
        working-directory: source/GalileyaMusicAndroid
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Galileya-Music-APK
          path: source/GalileyaMusicAndroid/app/build/outputs/apk/debug/app-debug.apk
